name: RestAssured API Regression Tests

# 1. Trigger the workflow on pushes or pull requests to the main branch, or manually
on:
  push:
    branches: [ "main", "master" ]
#  pull_request:
#    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to click a "Run workflow" button in GitHub

jobs:
  api-tests:
    runs-on: ubuntu-latest # Fast, lightweight Linux container

    steps:
      # 2. Checkout the source code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Setup Java environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Change to '11' or '21' if your project uses a different Java version
          distribution: 'temurin'
          cache: 'maven' # Caches dependencies so future CI runs are much faster

      # 4. Execute the RestAssured tests via Maven
      - name: Run RestAssured Tests
        run: mvn clean test -DsuiteXmlFile=testng.xml

      # 5. Publish Test Reports (Optional but highly recommended)
      # This captures Surefire/Failures reports so you can read them right in GitHub
      - name: Publish Test Report
        uses: scacap/action-surefire-report@v1
        if: always() # Ensures reports are generated even if a test case fails
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'