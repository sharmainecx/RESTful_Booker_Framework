name: RestAssured API Regression Tests

# 1. Trigger the workflow on pushes or pull requests to the main branch, or manually
on:
  push:
    branches: [ "main", "Working-Branch" ]
#  pull_request:
#    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to click a "Run workflow" button in GitHub

jobs:
  api-tests:
    runs-on: ubuntu-latest # Fast, lightweight Linux container

    steps:
      # 2. Checkout the source code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Setup Java environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '18' # Change to '11' or '21' if your project uses a different Java version
          distribution: 'temurin'
          cache: 'maven' # Caches dependencies so future CI runs are much faster

      # 4. Execute the RestAssured tests via Maven
      - name: Run RestAssured Tests
        run: mvn clean test -DsuiteXmlFile=testng.xml

      # 5. Publish Test Reports (Optional but highly recommended)
      # This captures Surefire/Failures reports so you can read them right in GitHub
      - name: Publish Test Report Summary
        if: always() # Ensures logs publish even if a test case fails
        run: |
        # Path to TestNG report file
          REPORT_FILE="target/surefire-reports/testng-results.xml"

        # Extract metrics safely from TestNG XML schema (uses 'total', 'failed', 'skipped')
          TOTAL_TESTS=$(grep -oP 'total="\K[0-9]+' "$REPORT_FILE" | head -n 1)
          FAILURES=$(grep -oP 'failed="\K[0-9]+' "$REPORT_FILE" | head -n 1)
          SKIPPED=$(grep -oP 'skipped="\K[0-9]+' "$REPORT_FILE" | head -n 1)

        # Fallback to 0 if variables are empty to prevent script crashes
          TOTAL_TESTS=${TOTAL_TESTS:-0}
          FAILURES=${FAILURES:-0}
          SKIPPED=${SKIPPED:-0}

        # Calculate Passed Tests
          PASSED=$((TOTAL_TESTS - FAILURES - SKIPPED))

          if [ "$FAILURES" -eq "0" ]; then
          STATUS_EMOJI="✅ **All tests executed successfully!**"
          else
          STATUS_EMOJI="❌ **Test suite execution failed! Please review logs.**"
          fi

          echo "### 📊 RestAssured API Test Results" >> $GITHUB_STEP_SUMMARY
          echo "$STATUS_EMOJI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests Run:** $TOTAL_TESTS" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed:** $PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- **Failures:** $FAILURES" >> $GITHUB_STEP_SUMMARY
          echo "- **Skipped:** $SKIPPED" >> $GITHUB_STEP_SUMMARY